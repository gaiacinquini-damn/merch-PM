/* Layout: indice a colonne come un portfolio — testata a due colonne, poi per ogni colore una fascia grigia con le colonne (colore · prove · tinta · indice) e le foto a filo, senza riquadri */
:root{
  --bg:#ffffff; --ink:#6c6c6c; --strong:#1c1c1c; --muted:#a3a3a3; --line:#e6e6e6; --band:#ebe9e6;
  --sans:"Suisse Intl", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Suisse Intl Mono", ui-monospace, Menlo, monospace;
  --c-bianco:#f4f4f1; --c-salvia:#7fae98; --c-giallo:#ead77a; --c-marrone:#7d6a54; --c-blu:#5d87bf; --c-nero:#141414;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --ink:#a9a9a9; --strong:#f0f0f0; --muted:#6e6e6e; --line:#262626; --band:#1d1c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --ink:#a9a9a9; --strong:#f0f0f0; --muted:#6e6e6e; --line:#262626; --band:#1d1c1b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.15;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased}
.pad{padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:1px solid var(--strong);outline-offset:2px}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:0}

/* testata */
.top{display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 0}
.name{font-size:26px;font-weight:700;letter-spacing:-.015em;margin:0;color:var(--ink)}
.plus{font-size:18px;color:var(--muted)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px 48px;padding-block:30px 72px}
.intro{font-size:22px;line-height:1.02;letter-spacing:-.012em;color:var(--muted);margin:0;max-width:30ch}
.intro b{font-weight:400;color:var(--ink)}
.meta{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,3fr);gap:0 24px;border-top:1px solid var(--line);padding-top:10px;margin-top:84px}
.meta + .meta{margin-top:56px}
.meta .k{color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:2px 0}
.opt{color:var(--muted);display:inline-flex;align-items:center}
.opt::after{content:",";color:var(--muted);margin-right:7px}
.opt:last-child::after{content:""}
.opt:hover{color:var(--ink)}
.opt[aria-pressed="true"]{color:var(--strong)}
.opt .dot{margin-right:6px;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.opt .n{font-family:var(--mono);font-size:11px;letter-spacing:0;vertical-align:super;line-height:0}

/* sezioni colore */
.colorsec{scroll-margin-top:0}
.band{background:var(--band);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:16px;padding-block:5px;align-items:center;color:var(--ink)}
.band .sw{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.band .up{color:var(--muted)}
.band .up:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 2px;padding-block:2px 88px}
.card{display:grid;gap:8px;text-align:left;cursor:zoom-in;min-width:0}
.card .ph{display:block;aspect-ratio:2000/1340;max-width:100%;background:#fff;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.card:hover img{opacity:.88}
.card .cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start}
.card .t{color:var(--ink)}
.card .d{color:var(--muted);grid-column:1/-1}
.cc{color:var(--muted);font-variant-numeric:tabular-nums}
.cc.has{color:var(--strong)}
.empty{color:var(--muted);padding-block:40px 120px}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px;padding-block:2px 88px}
.grid.dense .card{gap:0;position:relative}
.grid.dense .cap{display:none}
.grid.dense .tip{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:var(--bg);color:var(--ink);font-size:13px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.dense .card:hover .tip,.grid.dense .card:focus-visible .tip{opacity:1}
.grid:not(.dense) .tip{display:none}
.meta.first{margin-top:84px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px 22px;padding-block:10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.nav h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.nav h1 a{color:var(--ink);text-decoration:none}
.nav .jumps{display:flex;gap:4px 16px;flex-wrap:wrap;flex:1;min-width:0}
.nav .jumps a,.nav .navbtn{color:var(--muted);text-decoration:none;white-space:nowrap}
.nav .jumps a:hover,.nav .navbtn:hover{color:var(--ink)}
.nav .jumps a.on{color:var(--strong)}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:0;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.colorsec{scroll-margin-top:46px}
.bnav{display:flex;gap:16px;justify-content:flex-end;white-space:nowrap}
.bnav a{color:var(--muted)}
.bnav a:hover{color:var(--ink)}
.totop{position:fixed;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:9;background:var(--bg);border:1px solid var(--line);color:var(--ink);width:46px;height:46px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.totop[hidden]{display:none}
.totop:hover{color:var(--strong);border-color:var(--ink)}
.stage{position:relative}
.arrow{position:absolute;top:calc(50% - 22px);transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:var(--bg);color:var(--strong);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;z-index:2;opacity:.9}
.arrow:hover{opacity:1;border-color:var(--ink)}
.arrow.l{left:16px}.arrow.r{right:16px}
.lbbar .back{color:var(--strong);white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-block:10px 40px;color:var(--muted)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb[hidden]{display:none}
.lbbar{background:var(--band);display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:16px;padding-block:5px;align-items:center}
.lbbar .t{color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbbody{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.viewport{overflow:auto;background:#fff;cursor:zoom-in;overscroll-behavior:contain;min-height:0}
.viewport.zoom{cursor:zoom-out}
.viewport img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.viewport.zoom img{width:240%;height:auto;max-width:none}
.navs{display:flex;justify-content:space-between;gap:16px;padding-block:10px;border-top:1px solid var(--line)}
.navs button{color:var(--muted)} .navs button:hover{color:var(--ink)}
.hint{color:var(--muted)}

.panel{border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.ph-head{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 16px;padding:16px 18px 18px;border-bottom:1px solid var(--line)}
.ph-head .k{color:var(--muted)}
.clist{overflow:auto;padding:16px 18px;display:grid;gap:18px;align-content:start}
.cm{display:grid;gap:3px}
.cm .who{display:flex;justify-content:space-between;gap:12px;color:var(--strong)}
.cm .when{color:var(--muted)}
.cm .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3}
.cm .del{color:var(--muted);justify-self:start;font-size:13px}
.cm .del:hover{color:var(--ink)}
.cm .del.sure{color:#c0392b}
.nocm{color:var(--muted);line-height:1.3}
form.add{border-top:1px solid var(--line);padding:12px 18px 16px;display:grid;gap:10px}
form.add label{color:var(--muted)}
textarea{font:inherit;letter-spacing:inherit;line-height:1.3;width:100%;min-height:72px;resize:vertical;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--strong)}
textarea:focus{outline:none;border-bottom-color:var(--ink)}
#cName{font:inherit;letter-spacing:inherit;width:100%;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--strong)}
#cName:focus{outline:none;border-bottom-color:var(--ink)}
.formrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.send{color:var(--strong)}
.send:disabled{color:var(--muted);cursor:default}
.note{color:var(--muted)}

@media (max-width:860px){
  .head{grid-template-columns:1fr;padding-block:24px 48px}
  .meta{margin-top:28px}
  .meta + .meta{margin-top:24px}
  .band,.lbbar{grid-template-columns:minmax(0,1fr) auto}
  .band .hide-s,.lbbar .hide-s{display:none}
  .lbbody{grid-template-columns:1fr;grid-template-rows:minmax(0,52%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .ph-head{padding-block:12px}
}
@media (max-width:860px){
  .lbbar{grid-template-columns:auto minmax(0,1fr)}
  .nav .jumps{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .nav h1{flex:1}
  .arrow{width:42px;height:42px;top:50%}
  .arrow.l{left:8px}.arrow.r{right:8px}
}
@media (prefers-reduced-motion:reduce){.card img{transition:none}}
</style>
</head><body>


<nav class="nav pad" aria-label="Navigazione">
  <h1><a href="#index">Piccoli Mondi</a></h1>
  <div class="jumps" id="jumps"></div>
  <button class="navbtn" id="viewToggle" type="button"></button>
</nav>
<header class="pad" id="index">
  <div class="head">
    <div class="mono" style="color:var(--muted)">prove magliette<br><span id="tot">24</span> varianti · 6 colori</div>
    <div>
      <p class="intro"><b>Merch,</b> tutte le prove di stampa divise per colore del capo. Clicca una maglietta per vederla in grande, fronte e retro, e lasciare un commento.</p>
      <div class="meta"><span class="k">vista</span><div class="opts" id="viewOpts"></div></div>
      <div class="meta"><span class="k">colore</span><div class="opts" id="colorOpts"></div></div>
      <div class="meta"><span class="k">categoria</span><div class="opts" id="tagOpts"></div></div>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="foot pad">
  <span>Piccoli Mondi™ · Milano</span>
  <a href="#index" class="up">↑ indice</a>
</footer>

<button class="totop" id="totop" hidden aria-label="Torna su">↑</button>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <div class="lbbar pad">
    <button class="back" id="lbClose" aria-label="Torna alle magliette">← indietro</button>
    <span class="t" id="lbTitle"></span>
    <span class="hide-s" id="lbColor"></span>
    <span class="hide-s mono" id="lbPos" style="text-align:right"></span>
  </div>
  <div class="lbbody">
    <div class="stage">
      <div class="viewport" id="vp"><img id="lbImg" alt=""></div>
      <button class="arrow l" id="arL" aria-label="Maglietta precedente">←</button>
      <button class="arrow r" id="arR" aria-label="Maglietta successiva">→</button>
      <div class="navs pad">
        <button id="lbPrev">← precedente</button>
        <button id="lbZoom" class="hint">+ zoom</button>
        <button id="lbNext">successiva →</button>
      </div>
    </div>
    <aside class="panel">
      <div class="ph-head">
        <span class="k">file</span><span class="mono" id="lbCode"></span>
        <span class="k">colore</span><span id="lbColor2"></span>
        <span class="k">categoria</span><span id="lbTags"></span>
      </div>
      <div class="clist" id="clist" aria-live="polite"></div>
      <form class="add" id="addForm">
        <label for="cText">commento</label>
        <input id="cName" maxlength="40" placeholder="Il tuo nome" autocomplete="name">
        <textarea id="cText" maxlength="1000" placeholder="Cosa ne pensi di questa prova?"></textarea>
        <div class="formrow">
          <span class="note" id="formStatus"></span>
          <button class="send" id="cSend" type="submit">+ pubblica</button>
        </div>
      </form>
    </aside>
  </div>
</div>

<script>
const COLORS = [
  {id:"bianco",  name:"Bianco",          hex:"var(--c-bianco)"},
  {id:"giallo",  name:"Giallo burro",    hex:"var(--c-giallo)"},
  {id:"salvia",  name:"Verde salvia",    hex:"var(--c-salvia)"},
  {id:"blu",     name:"Blu denim",       hex:"var(--c-blu)"},
  {id:"marrone", name:"Marrone tabacco", hex:"var(--c-marrone)"},
  {id:"nero",    name:"Nero",            hex:"var(--c-nero)"},
];
const TAGS = ["Hustle Culture","Startuppers","Logo Piccoli Mondi","Illustrazioni","Frasi"];
const SHIRTS = [
  {id:"t1-1", color:"bianco", name:"Too many ideas", tags:["Frasi"]},
  {id:"t2",   color:"bianco", name:"Too many ideas · Keep hustlin' sul retro", tags:["Frasi","Hustle Culture"]},
  {id:"t19",  color:"bianco", name:"Piccoli Mondi, logo grafico", tags:["Logo Piccoli Mondi"]},
  {id:"t20",  color:"bianco", name:"Not quite there yet", tags:["Illustrazioni"]},
  {id:"t7",   color:"bianco", name:"P.M. Startuppers · scalatore sul retro", tags:["Logo Piccoli Mondi","Startuppers","Illustrazioni"]},
  {id:"t8",   color:"bianco", name:"P.M. box · scalatore sul retro", tags:["Logo Piccoli Mondi","Illustrazioni"]},
  {id:"t1-3", color:"giallo", name:"Piccoli Mondi, i corridori", tags:["Logo Piccoli Mondi","Illustrazioni"]},
  {id:"t4",   color:"giallo", name:"Piccoli Mondi tono su tono", tags:["Logo Piccoli Mondi"]},
  {id:"t9",   color:"giallo", name:"Hustle Culture 7:30 · versione A", tags:["Hustle Culture"]},
  {id:"t10",  color:"giallo", name:"Hustle Culture 7:30 · versione B", tags:["Hustle Culture"]},
  {id:"t16",  color:"giallo", name:"Make a difference", tags:["Frasi"]},
  {id:"t17",  color:"giallo", name:"Keep hustlin'", tags:["Frasi","Hustle Culture"]},
  {id:"t1-2", color:"salvia", name:"Graffette", tags:["Illustrazioni"]},
  {id:"t11",  color:"salvia", name:"Hustle Culture · Sisifo sul retro", tags:["Hustle Culture","Illustrazioni"]},
  {id:"t1",   color:"blu",    name:"Matite verticali", tags:["Illustrazioni"]},
  {id:"t3",   color:"blu",    name:"Matite orizzontali", tags:["Illustrazioni"]},
  {id:"t5",   color:"blu",    name:"Discovering new worlds · sul fronte", tags:["Logo Piccoli Mondi","Illustrazioni"]},
  {id:"t6",   color:"blu",    name:"Discovering new worlds · sul retro", tags:["Logo Piccoli Mondi","Illustrazioni"]},
  {id:"t1-4", color:"marrone",name:"Startuppers college", tags:["Startuppers"]},
  {id:"t13",  color:"marrone",name:"Hustle Culture · Sisifo", tags:["Hustle Culture","Illustrazioni"]},
  {id:"t15",  color:"marrone",name:"Sveglia 7:30 · Hustle Culture sul retro", tags:["Hustle Culture","Illustrazioni"]},
  {id:"t12",  color:"nero",   name:"Startuppers*", tags:["Startuppers"]},
  {id:"t14",  color:"nero",   name:"Hustlin' Learning Dreaming", tags:["Frasi","Hustle Culture"]},
  {id:"t18",  color:"nero",   name:"Piccoli Mondi Hustle Culture", tags:["Hustle Culture","Logo Piccoli Mondi"]},
];
const byId = Object.fromEntries(SHIRTS.map(s=>[s.id,s]));
const colorOf = id => COLORS.find(c=>c.id===id);
const artboard = id => "Artboard " + id.slice(1);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const swatch = c => `<span class="sw" style="background:${c.hex}"></span>`;

let fColor = null, fTag = null, view = "colori";
let comments = [], counts = {};
let me = null, isOwner = false, userApi = null, dbApi = null, dbState = "loading";
let names = {};
try { const s = JSON.parse(localStorage.getItem("pm-filters")||"{}"); fColor = s.c||null; fTag = s.t||null; if(s.v==="tutte") view = "tutte"; } catch(e){}

function opts(){
  const mk = (label, pressed, onClick, dot, n) => {
    const b = document.createElement("button"); b.type="button"; b.className="opt";
    b.setAttribute("aria-pressed", pressed);
    b.innerHTML = (dot?`<span class="dot" style="background:${dot}"></span>`:"") + `<span>${esc(label)}${n!=null?`<span class="n">${n}</span>`:""}</span>`;
    b.onclick = onClick; return b;
  };
  const vo = $("#viewOpts"), co = $("#colorOpts"), to = $("#tagOpts"); vo.innerHTML = ""; co.innerHTML = ""; to.innerHTML = "";
  vo.append(mk("per colore", view==="colori", ()=>{view="colori"; update();}));
  vo.append(mk("tutte vicine", view==="tutte", ()=>{view="tutte"; update();}));
  co.append(mk("tutti", !fColor, ()=>{fColor=null; update();}, null, SHIRTS.length));
  COLORS.forEach(c=> co.append(mk(c.name, fColor===c.id, ()=>{fColor = fColor===c.id?null:c.id; update();}, c.hex, SHIRTS.filter(s=>s.color===c.id).length)));
  to.append(mk("tutte", !fTag, ()=>{fTag=null; update();}));
  TAGS.forEach(t=> to.append(mk(t, fTag===t, ()=>{fTag = fTag===t?null:t; update();}, null, SHIRTS.filter(s=>s.tags.includes(t)).length)));
}
function visible(){ return SHIRTS.filter(s => (!fColor||s.color===fColor) && (!fTag||s.tags.includes(fTag))); }
function ccHtml(id){ const n = counts[id]||0; return `<span class="cc${n?" has":""}" data-cc="${id}">${n?`(${n}) ${n===1?"commento":"commenti"}`:"+ commenta"}</span>`; }

function render(){
  const m = $("#main"); const vis = visible(); m.innerHTML = "";
  if(!vis.length){ m.innerHTML = '<p class="empty pad">Nessuna prova con questi filtri. Togli il colore o la categoria.</p>'; return; }
  if(view==="tutte"){
    const sec = document.createElement("section"); sec.className="colorsec"; sec.id="tutte";
    const cols = COLORS.filter(c=>vis.some(s=>s.color===c.id));
    sec.innerHTML = `<div class="band pad"><span>Tutte le prove</span><span class="hide-s">${vis.length} ${vis.length===1?"prova":"prove"}</span><span class="hide-s">${cols.map(c=>swatch(c)).join("")}</span><a class="up" href="#index">↑ indice</a></div><div class="grid dense"></div>`;
    const g = sec.querySelector(".grid");
    COLORS.forEach(c=> vis.filter(s=>s.color===c.id).forEach(s=> g.append(cardEl(s))));
    m.append(sec); return;
  }
  COLORS.forEach(c=>{
    const list = vis.filter(s=>s.color===c.id); if(!list.length) return;
    const sec = document.createElement("section"); sec.className="colorsec"; sec.id="col-"+c.id;
    sec.innerHTML = `<div class="band pad"><span>${swatch(c)}${esc(c.name)}</span><span class="hide-s">${list.length} ${list.length===1?"prova":"prove"}</span><span class="hide-s">${esc([...new Set(list.flatMap(s=>s.tags))].slice(0,3).join(", "))}</span><span class="bnav">${nextLink(c.id, vis)}<a class="up" href="#index">↑ su</a></span></div><div class="grid"></div>`;
    const g = sec.querySelector(".grid");
    list.forEach(s=> g.append(cardEl(s)));
    m.append(sec);
  });
}
function cardEl(s){
  const b = document.createElement("button"); b.type="button"; b.className="card"; b.id="card-"+s.id;
  b.setAttribute("aria-label", "Apri " + s.name);
  b.innerHTML = `<span class="ph"><img src="img/${s.id}-s.webp" alt="${esc(s.name)}, fronte e retro" loading="lazy" width="760" height="509"></span>
    <span class="tip">${esc(s.name)}</span>
    <span class="cap pad"><span class="t">${esc(s.name)}</span>${ccHtml(s.id)}<span class="d">${esc(s.tags.join(", "))} · <span class="mono">${artboard(s.id)}</span></span></span>`;
  b.onclick = ()=>openLb(s.id);
  return b;
}
function update(){
  try{ localStorage.setItem("pm-filters", JSON.stringify({c:fColor,t:fTag,v:view})); }catch(e){}
  opts(); renderNav(); render(); onScroll();
}
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
function nextLink(cid, vis){
  const present = COLORS.filter(c=>vis.some(s=>s.color===c.id));
  const i = present.findIndex(c=>c.id===cid), n = present[i+1];
  return n ? `<a href="#" data-jump="${n.id}">↓ ${esc(n.name)}</a>` : "";
}
function renderNav(){
  $("#jumps").innerHTML = COLORS.map(c=>`<a href="#" data-jump="${c.id}">${swatch(c)}${esc(c.name)}</a>`).join("");
  $("#viewToggle").textContent = view==="colori" ? "vedi tutte vicine" : "vedi per colore";
}
$("#viewToggle").onclick = ()=>{ view = view==="colori" ? "tutte" : "colori"; update(); const t = document.querySelector(".colorsec"); if(t) t.scrollIntoView({behavior:smooth()}); };
function jumpTo(cid){
  let changed = false;
  if(view!=="colori"){ view="colori"; changed=true; }
  if(fColor && fColor!==cid){ fColor=null; changed=true; }
  if(fTag && !SHIRTS.some(s=>s.color===cid && s.tags.includes(fTag))){ fTag=null; changed=true; }
  if(changed) update();
  const el = document.getElementById("col-"+cid); if(el) el.scrollIntoView({behavior:smooth()});
}
document.addEventListener("click", e=>{
  const j = e.target.closest("[data-jump]");
  if(j){ e.preventDefault(); jumpTo(j.dataset.jump); return; }
  const a = e.target.closest('a[href="#index"]'); if(!a) return;
  e.preventDefault(); window.scrollTo({top:0, behavior:smooth()});
});
$("#totop").onclick = ()=> window.scrollTo({top:0, behavior:smooth()});
function onScroll(){
  $("#totop").hidden = window.scrollY < 500;
  let curSec = null;
  document.querySelectorAll(".colorsec[id^='col-']").forEach(s=>{ if(s.getBoundingClientRect().top < 90) curSec = s.id.slice(4); });
  document.querySelectorAll("#jumps a").forEach(a=> a.classList.toggle("on", a.dataset.jump===curSec));
}
window.addEventListener("scroll", onScroll, {passive:true});

/* ---------- Lightbox ---------- */
let cur = null, seq = [];
const lb = $("#lb"), vp = $("#vp"), img = $("#lbImg");
let pushed = false;
function openLb(id, fromNav){
  seq = visible().map(s=>s.id); if(!seq.includes(id)) seq = SHIRTS.map(s=>s.id);
  cur = id; showLb(); lb.hidden = false; document.body.style.overflow="hidden";
  if(!fromNav && location.hash !== "#"+id){ pushed = true; location.hash = id; }
  $("#lbClose").focus();
}
const clearHash = ()=>{ try{ history.replaceState(null,"",location.pathname + location.search); }catch(e){} };
function showLb(){
  const s = byId[cur], c = colorOf(s.color);
  setZoom(false);
  img.src = `img/${s.id}.webp`; img.alt = s.name + ", fronte e retro";
  $("#lbTitle").textContent = s.name;
  $("#lbCode").textContent = artboard(s.id);
  $("#lbColor").innerHTML = swatch(c) + esc(c.name);
  $("#lbColor2").textContent = c.name;
  $("#lbTags").textContent = s.tags.join(", ");
  $("#lbPos").textContent = `${seq.indexOf(cur)+1} / ${seq.length}`;
  renderComments();
  $("#cText").value = drafts[cur] || "";
}
function doClose(){
  if(lb.hidden) return;
  lb.hidden = true; document.body.style.overflow="";
  const card = document.getElementById("card-"+cur); if(card) card.focus({preventScroll:false});
  cur = null;
}
function closeLb(){
  if(pushed){ pushed = false; history.back(); setTimeout(()=>{ if(!lb.hidden){ clearHash(); doClose(); } }, 350); }
  else { clearHash(); doClose(); }
}
function step(d){ const i = seq.indexOf(cur); cur = seq[(i+d+seq.length)%seq.length]; showLb(); history.replaceState(null,"","#"+cur); }
function setZoom(on, ev){
  vp.classList.toggle("zoom", on);
  $("#lbZoom").textContent = on ? "− riduci" : "+ zoom";
  if(on){
    requestAnimationFrame(()=>{
      const r = vp.getBoundingClientRect();
      const fx = ev ? (ev.clientX - r.left)/r.width : .5, fy = ev ? (ev.clientY - r.top)/r.height : .5;
      vp.scrollLeft = fx*vp.scrollWidth - r.width/2; vp.scrollTop = fy*vp.scrollHeight - r.height/2;
    });
  }
}
let drag = null, moved = false;
vp.addEventListener("pointerdown", e=>{ if(!vp.classList.contains("zoom")||e.pointerType!=="mouse") return; drag={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop}; moved=false; });
window.addEventListener("pointermove", e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; vp.scrollLeft=drag.l-dx; vp.scrollTop=drag.t-dy; });
window.addEventListener("pointerup", ()=>{ drag=null; });
vp.addEventListener("click", e=>{ if(moved){ moved=false; return; } setZoom(!vp.classList.contains("zoom"), e); });
$("#lbZoom").onclick = ()=>setZoom(!vp.classList.contains("zoom"));
$("#lbClose").onclick = closeLb; $("#lbPrev").onclick = ()=>step(-1); $("#lbNext").onclick = ()=>step(1);
document.addEventListener("keydown", e=>{
  if(lb.hidden) return;
  if(e.target.tagName==="TEXTAREA"){ if(e.key==="Escape") e.target.blur(); return; }
  if(e.key==="Escape") closeLb(); else if(e.key==="ArrowLeft") step(-1); else if(e.key==="ArrowRight") step(1);
});
function fromHash(){
  const id = location.hash.slice(1);
  if(byId[id]){ if(lb.hidden) openLb(id, true); else if(id!==cur){ cur=id; showLb(); } }
  else if(!lb.hidden){ pushed = false; doClose(); }
}
$("#arL").onclick = ()=>step(-1); $("#arR").onclick = ()=>step(1);
let tx = null;
vp.addEventListener("touchstart", e=>{ if(vp.classList.contains("zoom")||e.touches.length>1){ tx=null; return; } tx = e.touches[0].clientX; }, {passive:true});
vp.addEventListener("touchend", e=>{ if(tx==null) return; const dx = e.changedTouches[0].clientX - tx; tx=null; if(Math.abs(dx)>50){ moved=true; step(dx<0?1:-1); setTimeout(()=>{moved=false;},50); } });
window.addEventListener("hashchange", fromHash);

/* ---------- Commenti ---------- */
const drafts = {};
$("#cText").addEventListener("input", e=>{ if(cur) drafts[cur] = e.target.value; });
function fmt(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("it-IT",{day:"numeric",month:"short"}) + " " + d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
}
async function resolveNames(ids){
  if(!userApi) return;
  const need = ids.filter(i=>i && !(i in names)); if(!need.length) return;
  try{ const ps = await userApi.profiles(need); need.forEach(i=>{ names[i] = (ps[i] && ps[i].name) || ""; }); }catch(e){ need.forEach(i=>{ names[i]=""; }); }
}
function renderComments(){
  if(!cur) return;
  const box = $("#clist");
  const list = comments.filter(c=>c.shirt===cur);
  const send = $("#cSend"), ta = $("#cText");
  if(dbState==="off"){
    box.innerHTML = '<p class="nocm">I commenti non sono ancora attivi su questo sito.</p>';
    ta.disabled = true; send.disabled = true; return;
  }
  ta.disabled = false; send.disabled = false;
  if(dbState==="loading"){ box.innerHTML = '<p class="nocm">Carico i commenti…</p>'; return; }
  if(!list.length){ box.innerHTML = '<p class="nocm">Ancora nessun commento su questa prova.</p>'; return; }
  box.innerHTML = list.map(c=>{
    const mine = false;
    const nm = c.name || "Anonimo";
    return `<div class="cm"><span class="who"><span>${esc(nm)}</span><span class="when mono">${fmt(c.at)}</span></span><span class="txt">${esc(c.text)}</span>${(mine||isOwner)?`<button class="del" type="button" data-del="${esc(c.id)}">elimina</button>`:""}</div>`;
  }).join("");
  box.querySelectorAll("[data-del]").forEach(b=> b.onclick = async ()=>{
    if(!b.classList.contains("sure")){ b.classList.add("sure"); b.textContent = "conferma eliminazione"; return; }
    b.disabled = true;
    try{ await dbApi.collection("comments").doc(b.dataset.del).delete(); }
    catch(e){ b.disabled=false; b.textContent="non eliminato, riprova"; }
  });
  const toResolve = [...new Set(list.map(c=>c.author))].filter(i=>i && !(i in names));
  if(toResolve.length) resolveNames(toResolve).then(renderComments);
}
function refreshCounts(){
  counts = {}; comments.forEach(c=>{ counts[c.shirt]=(counts[c.shirt]||0)+1; });
  document.querySelectorAll("[data-cc]").forEach(el=>{ el.outerHTML = ccHtml(el.dataset.cc); });
}
const nameIn = $("#cName");
try{ nameIn.value = localStorage.getItem("pm-name") || ""; }catch(e){}
nameIn.addEventListener("input", ()=>{ try{ localStorage.setItem("pm-name", nameIn.value); }catch(e){} });
$("#addForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const ta = $("#cText"), text = ta.value.trim(), name = nameIn.value.trim(), status = $("#formStatus"), send = $("#cSend");
  if(!name){ status.textContent = "Scrivi il tuo nome."; nameIn.focus(); return; }
  if(!text){ status.textContent = "Scrivi qualcosa prima di pubblicare."; return; }
  send.disabled = true; status.textContent = "Pubblico…";
  const shirt = cur;
  try{
    const r = await fetch("/api/comments", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({shirt, name: name.slice(0,40), text: text.slice(0,1000)})});
    if(!r.ok) throw new Error(String(r.status));
    drafts[shirt] = ""; if(cur===shirt) ta.value = "";
    status.textContent = "Pubblicato";
    setTimeout(()=>{ if(status.textContent==="Pubblicato") status.textContent=""; }, 2000);
    await loadComments();
  }catch(err){
    status.textContent = "Non pubblicato. Controlla la connessione e riprova.";
  }finally{ send.disabled = false; }
});

async function loadComments(){
  try{
    const r = await fetch("/api/comments", {cache:"no-store"});
    if(!r.ok) throw new Error(String(r.status));
    const data = await r.json();
    comments = (data.comments||[]).filter(c=>byId[c.shirt] && typeof c.text==="string").sort((a,b)=>a.at-b.at);
    dbState = "ready";
  }catch(e){ if(dbState!=="ready") dbState = "off"; }
  refreshCounts(); renderComments();
}
function initData(){ loadComments(); setInterval(()=>{ if(!document.hidden) loadComments(); }, 20000); }

$("#tot").textContent = SHIRTS.length;
opts(); renderNav(); render(); onScroll(); fromHash(); initData();
</script>
